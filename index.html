<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

      <path d="M197.879 144.092C196.707 142.92 196.707 141.021 197.879 139.849L200.636 137.092C201.808 135.92 203.707 135.92 204.879 137.092L207.636 139.849C208.808 141.021 208.808 142.92 207.636 144.092L204.879 146.849C203.707 148.021 201.808 148.021 200.636 146.849L197.879 144.092Z" fill="white"/>
    </symbol>

    <!-- End-screen outcome icons -->

    <symbol id="heartHappy" viewBox="0 0 139 139" fill="none">

      <path d="M50.271 23.6957C62.049 23.6957 72.3288 30.004 78 39.403C83.6712 30.0007 93.951 23.6957 105.729 23.6957C123.62 23.6957 138.125 38.2005 138.125 56.0917C138.12 60.0559 137.383 63.985 135.951 67.6812C125.239 98.4945 78 132.304 78 132.304C78 132.304 30.7613 98.4912 20.0493 67.6812C18.6648 64.077 17.875 60.1802 17.875 56.0917C17.875 38.2005 32.3798 23.6957 50.271 23.6957Z" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

</svg>

<div id="app">
  <!-- Decorative frame: 4 corner brackets + 4 edge segments (see .frame in
       styles.css). Sits behind the stage and never takes pointer input. -->
  <div class="frame" aria-hidden="true">
    <svg class="frame-corner frame-corner--tl" viewBox="0 0 218 216"><use href="#cornerFrame"/></svg>
    <svg class="frame-corner frame-corner--tr" viewBox="0 0 218 216"><use href="#cornerFrame"/></svg>
    <svg class="frame-corner frame-corner--bl" viewBox="0 0 218 216"><use href="#cornerFrame"/></svg>
    <svg class="frame-corner frame-corner--br" viewBox="0 0 218 216"><use href="#cornerFrame"/></svg>
    <div class="frame-edge frame-edge--top"></div>
    <div class="frame-edge frame-edge--bottom"></div>
    <div class="frame-edge frame-edge--left"></div>
    <div class="frame-edge frame-edge--right"></div>
  </div>

  <header class="topbar">
    <div class="gender-selector" role="group" aria-label="Pronoun">
      <div id="genderActiveHex" class="gender-active-pill" aria-hidden="true" style="transform: translateX(0px)"></div>
      <button class="gender-btn active" data-gender="She" aria-label="She" title="She">
        <svg class="gender-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8.5" r="5"/>
          <path d="M12 13.5V21.5M8.5 18H15.5"/>
        </svg>
      </button>
      <button class="gender-btn" data-gender="He" aria-label="He" title="He">
        <svg class="gender-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9.8" cy="14.2" r="5"/>
          <path d="M13.4 10.6L20 4M14.5 4H20V9.5"/>
        </svg>
      </button>
      <button class="gender-btn" data-gender="They" aria-label="They" title="They">
        <svg class="gender-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5"/>
        </svg>
      </button>
    </div>
    <div class="topbar-right">
      <button id="muteBtn" class="icon-btn" aria-label="Mute sound" aria-pressed="false" title="Mute sound">
        <svg viewBox="0 0 24 24" class="icon-unmuted" aria-hidden="true">
          <path class="speaker-body" d="M4 9.5H8L13 5V19L8 14.5H4Z"/>
          <path d="M16.2 9A4.2 4.2 0 0 1 16.2 15M18.8 6.4A8 8 0 0 1 18.8 17.6"/>
        </svg>
        <svg viewBox="0 0 24 24" class="icon-muted" aria-hidden="true">
          <path class="speaker-body" d="M4 9.5H8L13 5V19L8 14.5H4Z"/>
          <path d="M16.5 9.5L21.5 14.5M21.5 9.5L16.5 14.5"/>
        </svg>
      </button>
      <button id="newFlowerBtn" class="icon-btn" aria-label="New flower" title="New flower">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.38 4.75A8 8 0 1 1 8.62 4.75"/>
          <path d="M4.56 3.67L8.62 4.75L6.85 8.55"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="stage">
    <svg id="flowerSvg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="messageLayer" class="message-layer"></div>
    <div id="hint" class="hint">Drag a petal away to pluck it</div>
  </main>

  <div id="endScreen" class="end-screen hidden" aria-hidden="true">
    <div class="end-card">
      <div class="end-card-frame" aria-hidden="true">
        <svg class="end-card-corner end-card-corner--tl" viewBox="0 0 218 216"><use href="#cornerFrame"/></svg>
        <svg class="end-card-corner end-card-corner--tr" viewBox="0 0 218 216"><use href="#cornerFrame"/></svg>
        <svg class="end-card-corner end-card-corner--bl" viewBox="0 0 218 216"><use href="#cornerFrame"/></svg>
        <svg class="end-card-corner end-card-corner--br" viewBox="0 0 218 216"><use href="#cornerFrame"/></svg>
      </div>
      <div class="end-card-body">
        <div class="end-card-row">
          <svg class="end-sign-icon end-sign-icon--happy" viewBox="0 0 139 139" aria-hidden="true"><use href="#heartHappy"/></svg>
          <svg class="end-sign-icon end-sign-icon--sad" viewBox="0 0 180 156" aria-hidden="true"><use href="#heartBroken"/></svg>
          <div class="end-card-copy">
            <p id="endSignText" class="end-sign-text"></p>
            <p id="endSignSubtext" class="end-sign-subtext"></p>
            <button id="tryAgainBtn" class="end-sign-retry">Try again</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
