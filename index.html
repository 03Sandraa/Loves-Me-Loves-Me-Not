  </header>

  <main id="stage">
    <svg id="flowerSvg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet"></svg>

    <div id="hint" class="hint">Drag a petal away to pluck it</div>

  <div id="endScreen" class="end-screen hidden" aria-hidden="true">
    <div class="end-sign">
      <!-- Each rope is 3 undistorted repeats of the same strand stacked
           end to end (not one strand stretched), so it's always long
           enough to reach comfortably past the top of the screen no
           matter the viewport — its top end never runs out mid-air. -->

        <svg viewBox="0 0 13 350" class="end-rope-tile"><use href="#ropeStrand"/></svg>

      </div>
      <div class="end-rope end-rope--right" aria-hidden="true">

        <svg viewBox="0 0 13 350" class="end-rope-tile"><use href="#ropeStrand"/></svg>
      </div>
      <svg class="end-sign-frame" viewBox="0 0 702 463" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><use href="#signFrame"/></svg>
      <div class="end-sign-content">
        <svg class="end-sign-icon end-sign-icon--happy" viewBox="0 0 139 139" aria-hidden="true"><use href="#heartHappy"/></svg>
        <svg class="end-sign-icon end-sign-icon--sad" viewBox="0 0 180 156" aria-hidden="true"><use href="#heartBroken"/></svg>
        <p id="endSignText" class="end-sign-text"></p>
        <p id="endSignSubtext" class="end-sign-subtext"></p>
        <button id="tryAgainBtn" class="end-sign-retry">
          <svg class="wood-hex" viewBox="0 0 133 50" preserveAspectRatio="none" aria-hidden="true"><use href="#hexGender"/></svg>
          <span class="btn-label">Try again</span>
        </button>
      </div>
    </div>
  </div>
